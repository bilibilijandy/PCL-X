name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: windows-latest
            rid: win-x86
            ext: .exe
          - os: windows-latest
            rid: win-arm64
            ext: .exe
          # macOS
          - os: macos-latest
            rid: osx-x64
            ext: ''
          - os: macos-latest
            rid: osx-arm64
            ext: ''
          # Linux (glibc)
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
          - os: ubuntu-latest
            rid: linux-arm64
            ext: ''
          - os: ubuntu-latest
            rid: linux-arm
            ext: ''
          # Linux (musl)
          - os: ubuntu-latest
            rid: linux-musl-x64
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PCL-X/PCL-X.csproj

      - name: Publish (${{ matrix.rid }})
        # 单文件发布：下载即双击启动，无需解压。native 库内嵌自动解压。
        run: dotnet publish src/PCL-X/PCL-X.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true -o "${{ runner.temp }}/out/${{ matrix.rid }}"

      # 产物按「程序名-版本-系统-架构」命名：Windows 单文件 exe；macOS 封装 .app（双击即启动）；Linux 单文件
      - name: Package artifact (version + platform)
        shell: pwsh
        run: |
          $ver = "v1.${{ github.run_number }}.0"
          $rid = "${{ matrix.rid }}"
          $ext = "${{ matrix.ext }}"
          $out = Join-Path "${{ runner.temp }}" "out/$rid"
          $src = "PCL-X$ext"

          if ($rid -like "osx-*") {
            # macOS：单文件放入 .app/Contents/MacOS -> Info.plist -> ad-hoc 签名 -> zip。双击 .app 直接启动
            $appDir = Join-Path "${{ runner.temp }}" "app/PCL-X.app"
            $macDir = Join-Path $appDir "Contents/MacOS"
            New-Item -ItemType Directory -Force -Path $macDir | Out-Null
            Copy-Item -Path (Join-Path $out $src) -Destination (Join-Path $macDir "PCL-X") -Force

            $plistLines = @(
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
              '<plist version="1.0">',
              '<dict>',
              '  <key>CFBundleName</key><string>PCL-X</string>',
              '  <key>CFBundleDisplayName</key><string>PCL-X</string>',
              '  <key>CFBundleIdentifier</key><string>com.pclx.launcher</string>',
              '  <key>CFBundleExecutable</key><string>PCL-X</string>',
              '  <key>CFBundlePackageType</key><string>APPL</string>',
              '  <key>CFBundleVersion</key><string>__VER__</string>',
              '  <key>CFBundleShortVersionString</key><string>__VER__</string>',
              '  <key>LSMinimumSystemVersion</key><string>10.15</string>',
              '  <key>NSHighResolutionCapable</key><true/>',
              '</dict>',
              '</plist>'
            )
            $plist = ($plistLines -join "`n") -replace '__VER__', $ver
            Set-Content -Path (Join-Path $appDir "Contents/Info.plist") -Value $plist -Encoding UTF8
            & codesign --force --deep --sign - "$appDir"

            $zip = Join-Path $out "PCL-X-$ver-$rid.zip"
            & ditto -c -k --sequesterRsrc --keepParent "$appDir" "$zip"
            Remove-Item -Path (Join-Path $out $src) -Force
            echo "packaged to PCL-X-$ver-$rid.zip"
          }
          else {
            # Windows/Linux：单文件重命名为「程序名-版本-系统-架构」(Windows 带 .exe)
            $dst = "PCL-X-$ver-$rid$ext"
            Move-Item -Path (Join-Path $out $src) -Destination (Join-Path $out $dst) -Force
            echo "renamed to $dst"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-X-${{ matrix.rid }}
          path: ${{ runner.temp }}/out/${{ matrix.rid }}/PCL-X-*
          if-no-files-found: error

  # 编译成功后自动创建版本标签并生成 GitHub Release（无需手动推送 v* 标签）
  release:
    name: Auto Tag & Release
    if: ${{ github.event_name != 'pull_request' }}
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Determine version
        id: ver
        run: echo "version=v1.${{ github.run_number }}.0" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.version }}" || echo "tag already exists"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.ver.outputs.version }}" || echo "tag push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*